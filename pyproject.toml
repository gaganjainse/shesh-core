[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shesh-core"
version = "0.1.0"
description = "Shesh Brain/Soma core — consolidated MCP servers + tools: governance audit, secrets, brain, mind, shell, system, files, media, messaging, calendar, backup, containers, eBPF, skills, MCP bundle, ACP, wave"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = ["fastmcp>=3.4.7,<4"]

[project.optional-dependencies]
llm = ["httpx>=0.27"]   # shesh-files classifier LLM support
dev = ["pytest>=9.1", "pytest-asyncio>=0.24", "ruff>=0.16"]

[project.scripts]
shesh-audit-mcp = "shesh_audit.server:main"
shesh-secrets-mcp = "shesh_secrets.server:main"
shesh-brain-mcp = "shesh_brain.server:main"
shesh-mind-mcp = "shesh_mind.server:main"
shesh-shell-mcp = "shesh_shell.server:main"
shesh-system-mcp = "shesh_system.server:main"
shesh-media-mcp = "shesh_media.server:main"
shesh-messaging-mcp = "shesh_messaging.server:main"
shesh-calendar-mcp = "shesh_calendar.server:main"
shesh-backup-mcp = "shesh_backup.server:main"
shesh-containers-mcp = "shesh_containers.server:main"
shesh-ebpf-mcp = "shesh_ebpf.server:main"
shesh-skills-mcp = "shesh_skills.server:main"
shesh-mcp-bundle-mcp = "shesh_mcp_bundle.server:main"
shesh-acp = "shesh_acp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# BLE+TRY are errors, not style: blind `except Exception` is where silent
# failures live. Consolidated from the 16 folded repos — single config now,
# instead of 16 subtly-different ones.
select = ["E", "F", "W", "UP", "B", "SIM", "I", "BLE", "TRY"]
ignore = ["E402"]  # module imports after sys.path setup in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "E402", "E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
